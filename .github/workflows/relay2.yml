name: relay2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run
        continue-on-error: true
        run: |
          python3 scripts/fetch.py || true
          ls -R out | head -100
      - name: commit
        continue-on-error: true
        run: |
          git config user.name "relay-bot"
          git config user.email "relay-bot@users.noreply.github.com"
          git add -A
          git commit -m "multi-source results" || true
          git push || true
